name: Sync
on:
  push:
    branches:
      - main
  workflow_dispatch:   # 👈 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: env
        run: |
          sudo apt update -y
          sudo apt-get install skopeo -y
      - name: git
        run: |
          cd ~
          git clone https://github.com/ls-2018/script.git
          
          git clone https://github.com/lsutils/utils.git
      - name: run
        run: |
          set -x
          cd ~
          ls 
          export PATH=`pwd`/script/:$PATH
          env
          which skopeo_copy_script.py
#          python3 utils/sync/local_run.py
