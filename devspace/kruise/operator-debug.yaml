apiVersion: apps/v1
kind: Deployment
metadata:
  name: kruise-controller-manager
  namespace: kruise-system
  labels:
    control-plane: controller-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      control-plane: controller-manager
  template:
    metadata:
      labels:
        control-plane: controller-manager
    spec:
      containers:
        - name: manager
          image: openkruise/kruise-manager:v1.7.0
          command:
            - /manager
          args:
            - '--enable-leader-election'
            - '--metrics-addr=:8080'
            - '--health-probe-addr=:8000'
            - '--logtostderr=true'
            - '--leader-election-namespace=kruise-system'
            - '--v=4'
            - '--feature-gates=ImagePullJobGate=true,IgnoreUnExpectedNode=true'
            - '--sync-period=0'
          ports:
            - name: webhook-server
              containerPort: 9876
              protocol: TCP
            - name: metrics
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8000
              protocol: TCP
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
            - name: WEBHOOK_PORT
              value: '9876'
          resources:
            limits:
            requests:
          securityContext:
      serviceAccountName: kruise-manager
      serviceAccount: kruise-manager
      securityContext: {}
      nodeName: "koord-control-plane"
